<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Submit a product review including rating, installation date, useful features, and comments.">

    <meta name="author" content="Alexis Rivera">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form action="review.html" method="get">

    <!-- Product Name -->
    <div class="form-group">

        <label for="product">
            Product Name
            <span class="required" aria-hidden="true">*</span>
        </label>

        <select
            id="product"
            name="product"
            required
            aria-required="true">

            <option value="" disabled selected>
                Select a Product ...
            </option>

        </select>

    </div>

    <!-- Overall Rating -->
    <fieldset>

        <legend>
            Overall Rating
            <span class="required" aria-hidden="true">*</span>
        </legend>

        <div class="rating">

            <label for="rating1">
                <input
                    type="radio"
                    id="rating1"
                    name="rating"
                    value="1"
                    required>
                ☆
                <span class="sr-only">1 Star</span>
            </label>

            <label for="rating2">
                <input
                    type="radio"
                    id="rating2"
                    name="rating"
                    value="2">
                ☆☆
                <span class="sr-only">2 Stars</span>
            </label>

            <label for="rating3">
                <input
                    type="radio"
                    id="rating3"
                    name="rating"
                    value="3">
                ☆☆☆
                <span class="sr-only">3 Stars</span>
            </label>

            <label for="rating4">
                <input
                    type="radio"
                    id="rating4"
                    name="rating"
                    value="4">
                ☆☆☆☆
                <span class="sr-only">4 Stars</span>
            </label>

            <label for="rating5">
                <input
                    type="radio"
                    id="rating5"
                    name="rating"
                    value="5">
                ☆☆☆☆☆
                <span class="sr-only">5 Stars</span>
            </label>

        </div>

    </fieldset>

    <!-- Installation Date -->
    <div class="form-group">

        <label for="installDate">
            Date of Installation
            <span class="required" aria-hidden="true">*</span>
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required
            aria-required="true">

    </div>

    <!-- Useful Features -->
    <fieldset>

        <legend>Useful Features (Check all that apply)</legend>

        <div class="checkbox-group">

            <label for="durability">
                <input
                    type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">
                Durability
            </label>

            <label for="easeOfUse">
                <input
                    type="checkbox"
                    id="easeOfUse"
                    name="features"
                    value="Ease of Use">
                Ease of Use
            </label>

            <label for="performance">
                <input
                    type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">
                Performance
            </label>

            <label for="design">
                <input
                    type="checkbox"
                    id="design"
                    name="features"
                    value="Design">
                Design
            </label>

        </div>

    </fieldset>

    <!-- Written Review -->
    <div class="form-group">

        <label for="review">
            Written Review
        </label>

        <textarea
            id="review"
            name="review"
            rows="6"
            placeholder="Tell us what you think about the product..."></textarea>

    </div>

    <!-- User Name -->
    <div class="form-group">

        <label for="username">
            User Name
        </label>

        <input
            type="text"
            id="username"
            name="username"
            autocomplete="name"
            placeholder="Your name (optional)">

    </div>

    <!-- Submit -->
    <input
        type="submit"
        value="Submit Review"
        class="submit-btn">

</form>

</main>

<footer>

    <p>
        &copy; <span id="currentYear"></span> Alexis Rivera
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
