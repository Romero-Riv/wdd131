<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Product Review Form">

    <meta
        name="author"
        content="Alexis Rivera">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form action="review.html" method="get">

    <!-- Product Name -->
    <div class="form-group">

        <label for="product">
            Product Name <span class="required">*</span>
        </label>

        <select
            id="product"
            name="product"
            required>

            <option value="" disabled selected>
                Select a Product ...
            </option>

        </select>

    </div>

    <!-- Overall Rating -->
    <fieldset>

        <legend>
            Overall Rating <span class="required">*</span>
        </legend>

        <div class="rating">

            <input
                type="radio"
                id="rating1"
                name="rating"
                value="1"
                required>

            <label for="rating1">☆</label>

            <input
                type="radio"
                id="rating2"
                name="rating"
                value="2"
                required>

            <label for="rating2">☆☆</label>

            <input
                type="radio"
                id="rating3"
                name="rating"
                value="3"
                required>

            <label for="rating3">☆☆☆</label>

            <input
                type="radio"
                id="rating4"
                name="rating"
                value="4"
                required>

            <label for="rating4">☆☆☆☆</label>

            <input
                type="radio"
                id="rating5"
                name="rating"
                value="5"
                required>

            <label for="rating5">☆☆☆☆☆</label>

        </div>

    </fieldset>

    <!-- Date of Installation -->
    <div class="form-group">

        <label for="installDate">
            Date of Installation
            <span class="required">*</span>
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required>

    </div>

    <!-- Useful Features -->
    <fieldset>

        <legend>Useful Features (Check all that apply)</legend>

        <div class="checkbox-group">

            <input
                type="checkbox"
                id="durability"
                name="features"
                value="Durability">

            <label for="durability">Durability</label>

            <input
                type="checkbox"
                id="ease"
                name="features"
                value="Ease of Use">

            <label for="ease">Ease of Use</label>

            <input
                type="checkbox"
                id="performance"
                name="features"
                value="Performance">

            <label for="performance">Performance</label>

            <input
                type="checkbox"
                id="design"
                name="features"
                value="Design">

            <label for="design">Design</label>

        </div>

    </fieldset>

    <!-- Written Review -->
    <div class="form-group">

        <label for="review">
            Written Review
        </label>

        <textarea
            id="review"
            name="review"
            rows="6"
            placeholder="Write your review here..."></textarea>

    </div>

    <!-- User Name -->
    <div class="form-group">

        <label for="username">
            User Name
        </label>

        <input
            type="text"
            id="username"
            name="username"
            autocomplete="name"
            placeholder="Your name (optional)">

    </div>

    <!-- Submit -->

    <input
        type="submit"
        value="Submit Review"
        class="submit-btn">

</form>

</main>

<footer>

    <p>
        &copy;
        <span id="currentYear"></span>
        Alexis Rivera
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
