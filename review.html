<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Thank you for submitting your product review.">

    <meta
        name="author"
        content="Alexis Rivera">

    <title>Review Submitted</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>

</head>

<body>

<header>

    <h1>Review Submitted</h1>

</header>

<main class="confirmation">

    <section class="confirmation-card">

        <h2>Thank You!</h2>

        <p>
            Your product review has been submitted successfully.
        </p>

        <p>
            We appreciate your feedback and thank you for taking the time
            to share your experience.
        </p>

        <div class="review-counter">

            <h3>Total Reviews Submitted</h3>

            <p id="reviewCount">0</p>

        </div>

        <a
            href="form.html"
            class="submit-btn">
            Submit Another Review
        </a>

    </section>

</main>

<footer>

    <p>
        &copy;
        <span id="currentYear"></span>
        Alexis Rivera
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
