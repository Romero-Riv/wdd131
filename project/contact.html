<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Alexis Rivera">
    <meta name="description"
        content="Contact the Metal Gear Solid Encyclopedia with questions, corrections, or suggestions.">

    <title>Contact | Metal Gear Solid Encyclopedia</title>

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">

    <script src="scripts/form.js" defer></script>

</head>

<body>

    <header>

        <div class="logo">

            <img
                src="images/logo.avif"
                alt="Metal Gear Solid Encyclopedia Logo">

            <h1>FOXHOUND DATABASE</h1>

        </div>


        <nav>

            <ul class="navigation">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="games.html">Games</a>
                </li>

                <li>
                    <a href="characters.html">Characters</a>
                </li>

                <li>
                    <a href="timeline.html">Timeline</a>
                </li>

                <li>
                    <a class="current" href="contact.html">Contact</a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <!-- CONTACT INTRO -->

        <section class="contact-header">

            <p class="classified">
                SECURE COMMUNICATION CHANNEL
            </p>

            <h2>CONTACT FOXHOUND</h2>

            <p>
                Have information, corrections, or suggestions
                for the encyclopedia? Send a message.
            </p>

        </section>


        <!-- CONTACT FORM -->

        <section class="contact-container">

            <form id="contactForm">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    autocomplete="name">


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email">


                <label for="topic">
                    Message Topic
                </label>

                <select
                    id="topic"
                    name="topic"
                    required>

                    <option value="">
                        Select a topic
                    </option>

                    <option value="Games">
                        Games
                    </option>

                    <option value="Characters">
                        Characters
                    </option>

                    <option value="Timeline">
                        Timeline
                    </option>

                    <option value="Website Suggestion">
                        Website Suggestion
                    </option>

                </select>


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    required></textarea>


                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="newsletter"
                        name="newsletter">

                    Receive FOXHOUND updates

                </label>


                <button type="submit">
                    TRANSMIT MESSAGE
                </button>


                <!-- JavaScript confirmation -->

                <p id="formMessage"></p>

            </form>

        </section>

    </main>


    <footer>

        <p>
            FOXHOUND DATABASE ©
            <span id="year"></span>
        </p>

        <p>
            Metal Gear Solid Encyclopedia |
            WDD 131 Final Project
        </p>

    </footer>

</body>

</html>
